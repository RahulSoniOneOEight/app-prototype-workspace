id: pexels
resource_types: [stock_photography, stock_video, product_imagery]
search:
  method: api
  supports: [query, orientation, size]
evaluation:
  check: [license, subject_fit, visual_consistency, resolution, orientation, crop_suitability]
usage:
  prototype:
    preferred: remote_url
  production:
    preferred: reviewed_download_or_cdn
provenance:
  store: [provider, asset_id, source_url, license, query, creator, selected_at, usage]
notes:
  - Prefer client product assets for exact product representation.
  - Use provider API/terms current at selection time.
