id: direction_b
name: Search-first buying
strategy: search_led
structure:
  entry: home
  navigation: search_forward
journeys:
  primary:
    - core.browse_to_product
patterns:
  home: shared.home
  search: shared.search
  plp: shared.plp
  pdp: shared.pdp
density: compact
merchandising:
  emphasis:
    - recent_searches
    - popular_skus
    - comparison_shortcuts
interactions:
  search_prominence: primary
  browse_prominence: secondary
visual_style:
  hierarchy: product_first
  imagery: product_focused
resources:
  imagery_style: product_focused
  icon_family: iconoir
  stock_source_priority: [client_assets, pexels]
tradeoffs:
  - Lower inspiration and editorial discovery than Direction A.
rationale: Optimize for buyers who know the category, dimensions, material, or SKU they need.
