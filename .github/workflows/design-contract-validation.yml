name: Design Contract Validation

on:
  push:
    paths:
      - 'design-contract/**'
      - 'presets/**'
      - 'clients/**'
      - 'scripts/validate_design_contract.py'
      - 'AGENTS.md'
      - 'REFERENCE_POLICY.md'
      - 'DESIGN_SYSTEM.md'
      - 'VISUAL_QA.md'
      - 'PENPOT_MAPPING.md'
      - '.github/workflows/design-contract-validation.yml'
  pull_request:
    paths:
      - 'design-contract/**'
      - 'presets/**'
      - 'clients/**'
      - 'scripts/validate_design_contract.py'
      - 'AGENTS.md'
      - 'REFERENCE_POLICY.md'
      - 'DESIGN_SYSTEM.md'
      - 'VISUAL_QA.md'
      - 'PENPOT_MAPPING.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate design contract registry and client selections
        run: python scripts/validate_design_contract.py

      - name: Validate all JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('design-contract').rglob('*.json')) + list(Path('clients').rglob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Validated {len(paths)} JSON files')
          PY

      - name: Validate all YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          roots = [Path('design-contract'), Path('presets'), Path('clients')]
          paths = [p for root in roots for p in root.rglob('*.yaml')]
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print(f'Validated {len(paths)} YAML files')
          PY

      - name: Protect frozen reference material
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > /tmp/changed.txt
          if grep -E '^(prototype/figma-make/|references/figma-make/screenshots/)' /tmp/changed.txt; then
            echo 'Frozen reference material was modified.'
            exit 1
          fi
          echo 'Frozen reference material unchanged.'
